name: Oppdater data

on:
  schedule:
    # Hver tredje time, på et skjevt minutt. GitHub forsinket de faste kjøringene 05:30 og 14:00 UTC
    # med 6 til 8 timer (okt. og nov. 2026), så forrige handelsdags sluttkurser kom først neste ettermiddag.
    # Med kjøring hver tredje time kommer tallene inn kort tid etter at kildene publiserer:
    # Treasury og Cboe om kvelden i USA, FRED morgenen etter, KPI og sysselsetting 12:30 UTC.
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Installer Anthropic SDK (bare brukt hvis ANTHROPIC_API_KEY finnes)
        run: pip install --quiet anthropic

      - name: Hent Treasury
        run: python scripts/fetch_treasury.py
        continue-on-error: true

      - name: Hent FRED
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          PUBLISH_RESTRICTED: ${{ vars.PUBLISH_RESTRICTED }}
        run: python scripts/fetch_fred.py
        continue-on-error: true

      - name: Regn ut serier fra Treasury (breakeven)
        run: python scripts/derive.py
        continue-on-error: true

      - name: Hent direkte fra Cboe, Norges Bank og OFR
        run: python scripts/fetch_direct.py
        continue-on-error: true

      - name: Hent uoffisielle kilder
        env:
          PUBLISH_RESTRICTED: ${{ vars.PUBLISH_RESTRICTED }}
        run: python scripts/fetch_other.py
        continue-on-error: true

      - name: Hent nyheter og podcaster
        run: python scripts/fetch_news.py
        continue-on-error: true

      - name: Installer faster-whisper (bare når TRANSCRIBE_AUDIO=true)
        if: vars.TRANSCRIBE_AUDIO == 'true'
        run: pip install --quiet faster-whisper

      - name: Podcastagent (finn episoder, hent transkripsjon, analyser med Claude)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TRANSCRIBE_AUDIO: ${{ vars.TRANSCRIBE_AUDIO }}
        run: python scripts/podcast_agent.py --max-new 3
        continue-on-error: true
        timeout-minutes: 45

      - name: Oppsummer nyheter med Claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/summarize_news.py
        continue-on-error: true

      # Feiler bare hvis alle serier feilet.
      - name: Bygg status.json
        run: python scripts/build_status.py

      - name: Enhetstester
        run: node --test tests/calc.test.js

      - name: Commit og push hvis data er endret
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Ingen endringer i data/"
          else
            git commit -m "Oppdater data $(date -u +%F)"
            git push
          fi
